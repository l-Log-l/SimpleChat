pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven { url = "https://maven.kikugie.dev/releases" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.8.2'
}

stonecutter {
    centralScript = "build.gradle"
    
    shared {
        versions "1.20.1", "1.20.4", "1.20.6", "1.21", "1.21.1", "1.21.11"
    }
    
    create rootProject
}
